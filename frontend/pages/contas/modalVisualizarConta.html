<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Visualizar Conta</title>

</head>


<body>


    

    <div
        id="sobreposicaoModalVisualizacao"
        class="modal-overlay"
        aria-hidden="true"
    >

        <div
            id="modalVisualizacao"
            class="modal modalVisualizacao"
            role="dialog"
            aria-modal="true"
            aria-labelledby="tituloModalVisualizacao"
        >


            

            <div class="modal-header">

                <h2 id="tituloModalVisualizacao">
                    Visualizar Conta
                </h2>


                <button
                    type="button"
                    id="botaoFecharModalVisualizacao"
                    class="botaoFecharModal"
                    title="Fechar"
                    aria-label="Fechar modal"
                >

                    &times;

                </button>

            </div>


            

            <div class="modal-body">


                

                <div class="campoVisualizacao">

                    <label for="tipoVisualizacao">
                        Tipo
                    </label>

                    <span id="tipoVisualizacao">
                        -
                    </span>

                </div>


                

                <div class="campoVisualizacao">

                    <label for="descricaoVisualizacao">
                        Descrição
                    </label>

                    <span id="descricaoVisualizacao">
                        -
                    </span>

                </div>


                

                <div class="campoVisualizacao">

                    <label for="valorVisualizacao">
                        Valor
                    </label>

                    <span id="valorVisualizacao">
                        -
                    </span>

                </div>


                

                <div class="campoVisualizacao">

                    <label for="statusVisualizacao">
                        Status
                    </label>

                    <span id="statusVisualizacao">
                        -
                    </span>

                </div>


                

                <div class="campoVisualizacao">

                    <label for="dataVencimentoVisualizacao">
                        Data de vencimento
                    </label>

                    <span id="dataVencimentoVisualizacao">
                        -
                    </span>

                </div>


                

                <div class="campoVisualizacao">

                    <label for="clienteOuFornecedorVisualizacao">
                        Cliente / Fornecedor
                    </label>

                    <span id="clienteOuFornecedorVisualizacao">
                        -
                    </span>

                </div>


                

                <div class="campoVisualizacao">

                    <label for="planoDeContaVisualizacao">
                        Plano de Contas
                    </label>

                    <span id="planoDeContaVisualizacao">
                        -
                    </span>

                </div>


                

                <div class="campoVisualizacao">

                    <label for="usuarioVisualizacao">
                        Cadastrado por
                    </label>

                    <span id="usuarioVisualizacao">
                        -
                    </span>

                </div>

            </div>


            

            <div class="modal-footer">

                <button
                    type="button"
                    id="botaoCancelarModalVisualizacao"
                    class="btnCancelar"
                >

                    Fechar

                </button>

            </div>

        </div>

    </div>


    

    <script src="../../js/contas/modalVisualizarConta.js"></script>


</body>

</html>
